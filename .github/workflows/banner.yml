# Tests the banner generator. The banners themselves are generated from the live humanfia.ai by
# the `profile` workflow, so they are not compared against a fresh build here: the site moves on
# its own, and that comparison would fail whenever it did.

name: banner

on:
  push:
    branches: [main]
    paths: [tools/**, profile/*.svg, .github/workflows/banner.yml]
  pull_request:
    paths: [tools/**, profile/*.svg, .github/workflows/banner.yml]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  banner:
    name: banner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the generator
        run: python3 -m unittest discover -s tools -p 'test_*.py'
