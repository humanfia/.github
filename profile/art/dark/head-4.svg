<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 92" width="1000" height="92" role="img" aria-labelledby="t"><title id="t">Results</title><style>.paper{fill:#16161a}.ink{fill:#ece6da}.red{fill:#ff5a43}.mute{fill:#a39d92}.deep{fill:#4a120b}.hair{fill:none;stroke:#ece6da;stroke-width:1.5}.wire{fill:none;stroke:#ece6da;stroke-width:3;stroke-dasharray:10 8}.redwire{fill:none;stroke:#ff5a43;stroke-width:3}.chip{fill:#ece6da;fill-opacity:.1}.glyph{fill:none;stroke:#ece6da;stroke-width:13}.glyphr{fill:none;stroke:#ff5a43;stroke-width:13}.i16{font-family:'Helvetica Neue',Helvetica,Arial,'Segoe UI',sans-serif;font-weight:500;font-style:italic;font-size:16px}.k26{font-family:'Arial Black','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:900;font-size:26px}.k32{font-family:'Arial Black','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:900;font-size:32px}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs></defs><rect width="1000" height="92" class="paper"/><rect x="0" y="18" width="58" height="58" class="red"/><text x="29" y="60" class="k26 paper" text-anchor="middle">04</text><text x="78" y="56" class="k32 ink">RESULTS</text><text x="1000" y="56" class="i16 mute" text-anchor="end">Measured where somebody else keeps the score.</text><rect x="78" y="74" width="922" height="2" class="ink" opacity=".25"/><rect y="72" width="56" height="6" class="red"><animate attributeName="x" dur="9s" repeatCount="indefinite" values="78;944"/></rect></svg>
