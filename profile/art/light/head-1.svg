<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 92" width="1000" height="92" role="img" aria-labelledby="t"><title id="t">Projects</title><style>.paper{fill:#f4efe6}.ink{fill:#16161a}.red{fill:#d6331f}.mute{fill:#5f5a54}.deep{fill:#5e140b}.hair{fill:none;stroke:#16161a;stroke-width:1.5}.wire{fill:none;stroke:#16161a;stroke-width:3;stroke-dasharray:10 8}.redwire{fill:none;stroke:#d6331f;stroke-width:3}.chip{fill:#16161a;fill-opacity:.1}.glyph{fill:none;stroke:#16161a;stroke-width:13}.glyphr{fill:none;stroke:#d6331f;stroke-width:13}.i16{font-family:'Helvetica Neue',Helvetica,Arial,'Segoe UI',sans-serif;font-weight:500;font-style:italic;font-size:16px}.k26{font-family:'Arial Black','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:900;font-size:26px}.k32{font-family:'Arial Black','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:900;font-size:32px}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs></defs><rect width="1000" height="92" class="paper"/><rect x="0" y="18" width="58" height="58" class="red"/><text x="29" y="60" class="k26 paper" text-anchor="middle">01</text><text x="78" y="56" class="k32 ink">PROJECTS</text><text x="1000" y="56" class="i16 mute" text-anchor="end">Every project is open. Click one.</text><rect x="78" y="74" width="922" height="2" class="ink" opacity=".25"/><rect y="72" width="56" height="6" class="red"><animate attributeName="x" dur="9s" repeatCount="indefinite" values="78;944"/></rect></svg>
