<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="t"><title id="t">What Humanize keeps</title><style>.paper{fill:#f4efe6}.ink{fill:#16161a}.red{fill:#d6331f}.mute{fill:#5f5a54}.deep{fill:#5e140b}.hair{fill:none;stroke:#16161a;stroke-width:1.5}.wire{fill:none;stroke:#16161a;stroke-width:3;stroke-dasharray:10 8}.redwire{fill:none;stroke:#d6331f;stroke-width:3}.chip{fill:#16161a;fill-opacity:.1}.glyph{fill:none;stroke:#16161a;stroke-width:13}.glyphr{fill:none;stroke:#d6331f;stroke-width:13}.b15{font-family:'Helvetica Neue',Helvetica,Arial,'Segoe UI',sans-serif;font-weight:800;font-size:15px}.k19{font-family:'Arial Black','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:900;font-size:19px}.r15{font-family:'Helvetica Neue',Helvetica,Arial,'Segoe UI',sans-serif;font-weight:500;font-size:15px}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="11" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.086 0 0 0 0 0.086 0 0 0 0 0.102 0 0 1.4 0 -.62"/></filter></defs><rect width="1000" height="330" class="paper"/><rect x="32" y="20" width="285.33" height="6" class="ink"/><text x="32" y="56" class="k19 ink">A BUDGET IT KEEPS</text><text x="32" y="112" class="r15 mute">Stop on time, cost or tokens, so a run</text><text x="32" y="133" class="r15 mute">meant to take a night does not take a</text><text x="32" y="154" class="r15 mute">week.</text><rect x="32" y="200" width="285.33" height="38" class="chip"/><rect x="32" y="200" height="38" class="ink"><animate attributeName="width" dur="12s" repeatCount="indefinite" values="0;0;239.68;239.68;0" keyTimes="0;0.08;0.62;0.94;1"/></rect><rect x="271.68" y="186" width="6" height="66" class="red"/><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.62;0.94;1"/><rect x="181.68" y="252" width="96" height="32" class="red"/><text x="193.68" y="275" class="k19 paper">STOP</text></g><rect x="357.33" y="20" width="285.33" height="6" class="ink"/><text x="357.33" y="56" class="k19 ink">ONE CLOCK FOR EVERY</text><text x="357.33" y="80" class="k19 ink">TURN</text><text x="357.33" y="112" class="r15 mute">Every agent, sub-agent and tool call on</text><text x="357.33" y="133" class="r15 mute">a single timeline, opened as a Chrome</text><text x="357.33" y="154" class="r15 mute">trace.</text><rect x="357.33" y="200" height="18" class="ink"><animate attributeName="width" dur="12s" repeatCount="indefinite" values="0;0;85.6;85.6;0" keyTimes="0;0;0.24;0.94;1"/></rect><rect x="448.64" y="224" height="18" class="red"><animate attributeName="width" dur="12s" repeatCount="indefinite" values="0;0;62.77;62.77;0" keyTimes="0;0.256;0.432;0.94;1"/></rect><rect x="517.12" y="248" height="18" class="ink"><animate attributeName="width" dur="12s" repeatCount="indefinite" values="0;0;114.13;114.13;0" keyTimes="0;0.448;0.768;0.94;1"/></rect><rect x="380.16" y="200" height="18" class="red"><animate attributeName="width" dur="12s" repeatCount="indefinite" values="0;0;51.36;51.36;0" keyTimes="0;0.064;0.208;0.94;1"/></rect><rect x="471.47" y="224" height="18" class="ink"><animate attributeName="width" dur="12s" repeatCount="indefinite" values="0;0;71.33;71.33;0" keyTimes="0;0.32;0.52;0.94;1"/></rect><rect x="557.07" y="248" height="18" class="red"><animate attributeName="width" dur="12s" repeatCount="indefinite" values="0;0;74.19;74.19;0" keyTimes="0;0.56;0.768;0.94;1"/></rect><rect y="190" width="3" height="92" class="ink" x="357.33"><animate attributeName="x" dur="12s" repeatCount="indefinite" values="357.33;642.67;357.33" keyTimes="0;0.94;1"/></rect><rect x="682.67" y="20" width="285.33" height="6" class="ink"/><text x="682.67" y="56" class="k19 ink">WHEREVER THE WORK</text><text x="682.67" y="80" class="k19 ink">BELONGS</text><text x="682.67" y="112" class="r15 mute">Locally, in a git worktree, in a container,</text><text x="682.67" y="133" class="r15 mute">or on another machine over SSH.</text><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.1;0.94;1"/><rect x="682.67" y="200" width="14" height="18" class="red"/><text x="706.67" y="215" class="b15 ink">this directory</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.25;0.94;1"/><rect x="682.67" y="226" width="14" height="18" class="red"/><text x="706.67" y="241" class="b15 ink">another machine, over ssh</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.4;0.94;1"/><rect x="682.67" y="252" width="14" height="18" class="red"/><text x="706.67" y="267" class="b15 ink">a git worktree</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.55;0.94;1"/><rect x="682.67" y="278" width="14" height="18" class="red"/><text x="706.67" y="293" class="b15 ink">a container</text></g><rect width="1000" height="330" filter="url(#grain)" opacity=".16"/></svg>
